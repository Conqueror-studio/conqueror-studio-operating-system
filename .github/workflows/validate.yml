name: Validate CSOS contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json')]"
      - name: Require governance files
        run: test -f docs/constitution.md && test -f docs/quality-gates.md && test -f docs/integration-contract.md && test -f docs/agent-runbook.md
